<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Orbital · Hoje</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --ink:#1c1c1e; --muted:#8e8e93; --line:rgba(60,60,67,.13);
    --red:#dc2626; --red-bg:#fee2e2; --redk:#991b1b;
    --yellow:#b45309; --yellow-bg:#fef3c7;
    --orange:#c2410c; --orange-bg:#ffedd5;
    --purple:#6d28d9; --purple-bg:#ede9fe;
    --green:#15803d; --accent:#007aff;
    --radius:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000000; --card:#1c1c1e; --ink:#f2f2f7; --muted:#98989f; --line:rgba(120,120,128,.32);
      --accent:#0a84ff; --red-bg:#3b1417; --yellow-bg:#3a2e0c; --orange-bg:#3a1f0c; --purple-bg:#241a3d;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.55); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 40px;}
  .wrap{max-width:1040px;margin:0 auto;padding:16px;}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  #gate[hidden]{display:none!important}
  #app[hidden]{display:none!important}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:380px;width:100%;}
  #gate h2{margin:0 0 6px;font-size:18px}
  #gate p{margin:0 0 14px;color:var(--muted);font-size:13px}
  #gate input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #gate input:focus{outline:none;border-color:var(--accent)}
  #gate button,.btn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  #gate button:active,.btn:active{transform:scale(.98)}
  #gate .err{color:var(--red);font-size:12px;margin-top:8px;min-height:14px}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  header.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .state{color:var(--muted);font-size:13.5px;margin-top:3px;max-width:70ch}
  .meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .updated{color:var(--muted);font-size:11.5px;text-align:right}
  .refresh{border:0;background:rgba(120,120,128,.16);color:var(--ink);border-radius:20px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s,transform .1s}
  .refresh:hover{background:rgba(120,120,128,.26)}
  .refresh:active{transform:scale(.95)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;margin-bottom:12px}
  /* §9: headers secundários com -20% de peso — AGORA e Única Coisa dominam */
  .card h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);opacity:.82;display:flex;align-items:center;gap:8px}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--line);color:var(--ink)}
  .focus{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .focus .f{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14px;font-weight:500;line-height:1.4;display:flex;gap:9px}
  .focus .n{color:var(--accent);font-weight:800}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .day{min-width:0}
  .day h3{margin:0 0 6px;font-size:11.5px;font-weight:700;color:var(--muted)}
  .ev{border-left:3px solid var(--accent);background:rgba(0,122,255,.06);padding:7px 9px;border-radius:0 8px 8px 0;margin-bottom:6px}
  .ev .t{font-weight:700;font-size:12.5px;color:var(--muted)}
  .ev .ti{font-size:13.5px;font-weight:600}
  .ev .p{font-size:11.5px;color:var(--muted)}
  .ev .flag{margin-top:4px;font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-bg);padding:2px 6px;border-radius:6px;display:inline-block}
  /* agenda v2 — altura ∝ duração */
  .ev2{border-left:3px solid var(--accent);background:rgba(0,122,255,.07);padding:5px 9px;border-radius:0 8px 8px 0;margin-bottom:4px;display:flex;flex-direction:column;gap:1px}
  .ev2 .flag{white-space:normal}
  .ev2-t{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
  .ev2-ti{font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev2 .p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev2 .flag{margin-top:2px;font-size:11px;font-weight:600;color:var(--muted);background:rgba(100,116,139,.12);padding:1px 6px;border-radius:6px;display:inline-block;align-self:flex-start}
  .ev2 .flag.hot{font-weight:700;color:var(--red);background:var(--red-bg)}
  .ev2.past{opacity:.45}
  /* convite não confirmado (confirmed:false) — está na agenda, mas você não aceitou.
     Aparece sempre: sumir com ele é o que fazia o AGORA mentir. */
  .ev2.unconf{border-left-style:dashed;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
  .ev2.unconf .ev2-ti{font-weight:500}
  .ev2 .invite{margin-top:2px;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);background:rgba(120,120,128,.12);padding:1px 6px;border-radius:6px;display:inline-block;align-self:flex-start}
  .nowline{border-top:2px solid var(--accent);position:relative;margin:8px 0 6px}
  .nowline::before{content:"agora";position:absolute;top:-8px;left:0;font-size:9px;font-weight:800;color:var(--accent);background:var(--card);padding-right:5px;text-transform:uppercase;letter-spacing:.05em}
  /* ⏰ AGORA — era um bloco preto full-width; virou cartão leve com âncora de cor.
     O peso visual pertence ao Card Única Coisa, não ao relógio. */
  .now-strip{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:12px;padding:11px 14px;margin-bottom:12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .now-strip .k{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .now-strip .main{font-size:14.5px;font-weight:700;flex:1 1 160px;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .now-strip .cd{font-size:11.5px;font-weight:800;color:var(--ink);background:rgba(120,120,128,.14);padding:2px 9px;border-radius:20px;white-space:nowrap}
  .now-strip .cd.done-cd{color:var(--green);background:rgba(21,128,61,.12)}
  .now-strip .sub{font-size:12px;color:var(--muted);width:100%}
  /* cockpit — o topo deixa de ser pilha full-width e vira duas colunas */
  .cockpit{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
  .ck-side>*:last-child{margin-bottom:0}
  /* mobile: uma coluna, e a Única Coisa continua vindo PRIMEIRO — enterrá-la sob
     agora/frota invertia a hierarquia que o cockpit existe para afirmar. */
  @media (max-width:880px){ .cockpit{grid-template-columns:1fr} }
  /* check de conclusão (dopamina, local) */
  .chk{width:16px;height:16px;min-width:16px;border:1.5px solid var(--muted);border-radius:5px;display:inline-block;vertical-align:-3px;margin-right:8px;cursor:pointer;flex-shrink:0}
  .chk:hover{border-color:var(--green)}
  .done-item{opacity:.5}
  .done-item .chk{background:var(--green);border-color:var(--green)}
  .done-item .chk::after{content:"✓";color:#fff;font-size:11px;font-weight:800;display:block;text-align:center;line-height:14px}
  .tk.done-item{text-decoration:line-through}
  .f.done-item span:last-child{text-decoration:line-through}
  .free{font-size:10.5px;color:var(--green);background:rgba(21,128,61,.05);border:1px dashed rgba(21,128,61,.35);border-radius:6px;text-align:center;padding:2px 0;margin-bottom:4px}
  .freeday{color:var(--green);font-size:12.5px;font-style:italic;padding:6px 0}
  .empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:6px 0}
  .tk{padding:8px 0;border-bottom:1px solid var(--line)}
  .tk:last-child{border:0}
  .tk .lab{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:7px;text-transform:uppercase}
  .lab.p1{background:var(--red-bg);color:var(--red)}
  .lab.over{background:var(--red-bg);color:var(--redk)}
  .lab.fu{background:var(--orange-bg);color:var(--orange)}
  .tk .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{background:var(--purple-bg);color:var(--purple);font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .dmeta{color:var(--muted);font-size:12.5px}
  .sig{display:flex;flex-wrap:wrap;gap:18px;color:var(--muted);font-size:13px}
  .sig b{color:var(--ink);font-size:16px;font-weight:800;margin-right:4px}
  details.raw{margin-top:6px}
  details.raw summary{cursor:pointer;color:var(--accent);font-size:12.5px}
  details.raw pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:8px;margin-top:6px}
  .err-banner{background:var(--red-bg);color:var(--red);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .row{padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border:0}
  .row .ti{font-weight:600;font-size:14px}
  .row .why{color:var(--muted);font-size:12.5px;margin-top:2px}
  .row .who{font-size:11.5px;font-weight:500;color:var(--muted);background:transparent;padding:0;margin-left:8px}
  .row .who::before{content:"· ";opacity:.6}
  .dot{font-size:10px;margin-right:6px;vertical-align:middle}
  a.lnk{color:var(--accent);text-decoration:none}
  a.lnk:hover{text-decoration:underline}
  a.evlnk{color:inherit;text-decoration:none}
  a.evlnk:hover{text-decoration:underline}
  .lane{margin:0 0 14px}
  .lane:last-child{margin-bottom:0}
  .lane-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;display:flex;align-items:center;gap:6px}
  .inbox-sum{font-size:12px;color:var(--muted);margin:-2px 0 12px;display:flex;flex-wrap:wrap;gap:10px}
  .rest{color:var(--muted);font-size:12.5px;font-style:italic;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
  /* email row */
  .mail{padding:9px 0 9px 10px;border-left:2px solid var(--line);margin-bottom:2px}
  .mail+.mail{border-top:1px solid var(--line)}
  .mail-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .who-tag{font-size:10.5px;font-weight:600;color:var(--muted);background:rgba(120,120,128,.09);padding:1px 7px;border-radius:6px;white-space:nowrap}
  .topic-tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:rgba(120,120,128,.06);padding:1px 7px;border-radius:6px}
  .mail .age{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .mail .nudge{font-size:10px;font-weight:800;color:var(--orange);background:var(--orange-bg);padding:1px 7px;border-radius:6px}
  .mail-act{font-size:14px;color:var(--ink);font-weight:600;line-height:1.35;margin:1px 0}
  .mail-subj{display:block;font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .mail-subj:hover{color:var(--accent);text-decoration:underline}
  .mail-subj.main{color:var(--ink);font-size:13.5px;font-weight:600;white-space:normal}
  .mail-subj.main:hover{color:var(--accent)}
  /* tabs */
  .tabs{display:inline-flex;gap:2px;flex-wrap:wrap;margin-bottom:14px;background:rgba(120,120,128,.12);padding:3px;border-radius:12px}
  .tab-btn{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
  .tab-btn b{font-weight:800;color:inherit}
  .tab-btn.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .tab-btn.active b{color:var(--ink)}
  .tab-panel[hidden]{display:none}
  /* collapse */
  .card-h{cursor:pointer;user-select:none}
  .caret{display:inline-block;color:var(--muted);font-size:10px;transition:transform .15s;margin-right:2px}
  .card:not(.collapsed) .caret{transform:rotate(90deg)}
  .card.collapsed .card-body{display:none}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
  #modal[hidden]{display:none!important}
  .modal-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:680px;width:100%;max-height:85vh;display:flex;flex-direction:column}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .modal-head button{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
  /* leitura executiva do brief: prosa, não markdown cru */
  #modalBody{margin:0;padding:18px 20px;overflow:auto;font-size:14.5px;line-height:1.6;color:var(--ink)}
  #modalBody.plain{white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,monospace}
  #modalBody h3,#modalBody h4{margin:20px 0 8px;line-height:1.3}
  #modalBody h3:first-child,#modalBody h4:first-child,#modalBody .mdh:first-child{margin-top:0}
  #modalBody h3{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
  #modalBody h4{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  #modalBody .mdh{margin:18px 0 6px;font-size:14.5px;font-weight:800}
  #modalBody .mdh:first-child{font-size:17px}
  #modalBody p{margin:0 0 11px}
  #modalBody ul,#modalBody ol{margin:0 0 12px;padding-left:4px;list-style:none}
  #modalBody li{position:relative;padding:4px 0 4px 22px;line-height:1.5}
  #modalBody ul>li::before{content:"";position:absolute;left:6px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  #modalBody ol{counter-reset:mdli}
  #modalBody ol>li{counter-increment:mdli}
  #modalBody ol>li::before{content:counter(mdli);position:absolute;left:0;top:4px;font-size:11px;font-weight:800;color:var(--accent);background:var(--bg);border:1px solid var(--line);width:17px;height:17px;border-radius:50%;text-align:center;line-height:16px}
  #modalBody li+li{border-top:1px solid var(--line)}
  #modalBody strong{font-weight:700}
  #modalBody code{font:12.5px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  #modalBody a.lnk{color:var(--accent);text-decoration:none}
  #modalBody a.lnk:hover{text-decoration:underline}
  /* ＋ captura — botão flutuante */
  .fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:40;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;font-weight:300;line-height:0;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.24);display:flex;align-items:center;justify-content:center;transition:transform .14s ease}
  .fab[hidden]{display:none!important}
  .fab:hover{transform:scale(1.05)}
  .fab:active{transform:scale(.9)}
  .fab-q{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
  /* captura — folha (bottom sheet) */
  #cap{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #cap[hidden]{display:none!important}
  .cap-box{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px rgba(0,0,0,.3);animation:capUp .26s cubic-bezier(.32,.72,0,1)}
  @keyframes capUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .cap-grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 12px}
  .cap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cap-title{font-size:15px;font-weight:700}
  .cap-head button{border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 6px}
  #capText{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px 14px;resize:none;outline:none}
  #capText:focus{border-color:var(--accent)}
  .cap-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .cap-hint{font-size:11.5px;color:var(--muted)}
  .cap-go{border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:14.5px;font-weight:700;padding:10px 20px;cursor:pointer;transition:transform .1s}
  .cap-go:active{transform:scale(.97)}
  @media(min-width:600px){ #cap{align-items:center} .cap-box{border-radius:22px;animation:capIn .2s ease} }
  @keyframes capIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  /* toast */
  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:92px;z-index:70;background:var(--ink);color:var(--card);padding:11px 20px;border-radius:22px;font-size:13.5px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.32);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  #toast[hidden]{display:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* capturas pendentes (aguardando triagem) */
  .cap-row{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
  .cap-row:last-child{border:0}
  .cap-ic{font-size:13px;opacity:.5;margin-top:2px}
  .cap-txt{flex:1;min-width:0;font-size:14px;line-height:1.4}
  .cap-meta{font-size:11px;color:var(--muted);margin-top:2px}
  /* 🌙 fechamento do dia */
  .night-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
  .night-row:last-of-type{border-bottom:0}
  .night-row .t{flex:1;min-width:0;font-size:13.5px}
  .push-btn{border:0;background:rgba(120,120,128,.14);color:var(--ink);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:14px;cursor:pointer;white-space:nowrap}
  .push-btn:active{transform:scale(.95)}
  .pushed{font-size:11px;font-weight:700;color:var(--green);white-space:nowrap}
  .night-note{display:flex;gap:8px;margin-top:10px}
  .night-note input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:13.5px;padding:9px 12px;outline:none}
  .night-note input:focus{border-color:var(--accent)}
  .night-note button{border:0;border-radius:12px;background:rgba(120,120,128,.16);color:var(--ink);font-size:12.5px;font-weight:700;padding:0 14px;cursor:pointer}
  .close-day{margin-top:12px;width:100%;border:0;border-radius:12px;background:var(--ink);color:var(--card);font-size:13.5px;font-weight:700;padding:11px;cursor:pointer}
  .close-day:active{transform:scale(.98)}
  .closed-line{font-size:13px;color:var(--muted)}
  /* 🧊 emperrado */
  .stale{font-size:10px;font-weight:700;color:#0369a1;background:rgba(3,105,161,.08);padding:1px 6px;border-radius:5px;margin-left:7px;white-space:nowrap}
  @media (prefers-color-scheme:dark){.stale{color:#7dd3fc;background:rgba(125,211,252,.12)}}
  /* 🤝 radar */
  .vip-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .vip-row:last-child{border:0}
  .vip-row .d{font-weight:800;color:var(--orange)}
  .vip-row .hint{color:var(--muted);font-size:12px;margin-top:1px}
  @media (max-width:720px){
    .focus{grid-template-columns:1fr}
    .cols{grid-template-columns:1fr}
    .days{grid-template-columns:1fr}
    header.top h1{font-size:19px}
  }

/* ═══ 2.0 · modo manhã / Card Única Coisa ═══ */
.editorial{font-size:16px;line-height:1.45;font-weight:600;margin:2px 0 16px;max-width:62ch}
.editorial::before{content:"“";opacity:.35;margin-right:1px}
.editorial::after{content:"”";opacity:.35}
.one{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 20px 16px;margin-bottom:14px}
.one.done-item{opacity:.55}
/* faixa fina do que já foi fechado hoje — dopamina sem card ocioso */
.closed-strip{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.closed-strip .cl{font-size:12px;font-weight:600;color:var(--green);background:rgba(21,128,61,.09);
  border:1px solid rgba(21,128,61,.2);padding:3px 10px;border-radius:20px}
@media (prefers-color-scheme:dark){.closed-strip .cl{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.24)}}
/* celebração — mira do dia limpa */
.hero-done{text-align:center;padding:26px 20px}
.hero-done .hd-ic{font-size:34px;line-height:1}
.one-chal{font-size:12.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.one-ti{font-size:21px;font-weight:700;line-height:1.28;letter-spacing:-.01em}
.one.done-item .one-ti{text-decoration:line-through}
.one-why{font-size:14px;color:var(--muted);line-height:1.45;margin-top:7px;max-width:56ch}
.agebar{height:4px;border-radius:3px;background:var(--line);margin:13px 0 5px;overflow:hidden}
.agebar i{display:block;height:100%;border-radius:3px}
.a-fresh i{background:var(--green)}
.a-warm i{background:var(--yellow)}

@keyframes agepulse{0%,100%{opacity:1}50%{opacity:.45}}
.age-txt{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.age-txt.hot{color:var(--red)}
.one-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.act{border:0;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s}
.act:active{transform:scale(.97)}
/* [marcar feito] — botão de AÇÃO, não estado. Preenchido escuro lia como "já feito";
   agora é contornado com ○ vazio, e só vira verde sólido ✓ depois de fechado. */
.act-do{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);display:inline-flex;align-items:center;gap:7px}
.act-do::before{content:"";width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;flex-shrink:0}
.act-do:hover{background:rgba(120,120,128,.08)}

.act-copy{background:var(--accent);color:#fff}
.act-ghost{background:rgba(120,120,128,.16);color:var(--ink)}

.fear{margin-top:12px}

.fear>summary::-webkit-details-marker{display:none}

/* celebração sóbria ≤600ms */
@keyframes shipped{0%{transform:scale(1)}35%{transform:scale(1.012)}100%{transform:scale(1)}}
.shipped{animation:shipped .5s ease-out}
/* placar de fechamentos + streak */
.streak{font-size:12.5px;color:var(--muted);padding:4px 2px 0}
.streak b{color:var(--ink);font-weight:800}
.closes{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}

.spark{font-size:13px;color:var(--muted);padding:10px 2px 0;line-height:1.4}
.spark b{color:var(--ink);font-weight:600}
/* ver o resto do dia */
.more{display:inline-block;margin:6px 2px 0;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;background:0;border:0;padding:6px 0}
/* 🔒 bloco sagrado */
.sacred{border-left:3px solid var(--purple);background:var(--purple-bg);color:var(--purple);font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:0 8px 8px 0;margin-bottom:4px}
/* envelhecimento nas tasks da visão completa */
.agedot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;flex-shrink:0}
.agedot.a-fresh{background:var(--green)}
.agedot.a-warm{background:var(--yellow)}
.agedot.a-hot{background:var(--red)}
.push-btn.warn{background:var(--yellow-bg);color:var(--yellow)}
.push-btn.ask{background:var(--red-bg);color:var(--red)}
.cov{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 0 0;opacity:.75}

/* 🤖 Frota — 4 tiles compactos no topo (substitui a lista do rodapé) */
.fleet4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ftile{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 10px;min-width:0}
.ftile .n{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .st{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sdot.ok{background:var(--green)}

.ftile:hover{border-color:var(--accent)}
.ftile.open{border-color:var(--accent);background:var(--card)}
/* detalhe do agente — hierarquia executiva: o último trabalho primeiro,
   histórico colapsado em seguida, e só então frequência/objetivo. */
.ag-detail{margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
.ag-lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ag-when{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:6px}
.ag-sum{font-size:14.5px;line-height:1.45;margin-top:5px;font-weight:500}
.ag-sum.vazio{font-size:13px;font-weight:400;color:var(--muted);line-height:1.5}
.ag-detail .links{margin-top:8px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
.ag-hist-t{margin-top:12px;border:0;background:transparent;color:var(--ink);font-size:12px;font-weight:700;
  cursor:pointer;padding:5px 0;display:flex;align-items:center;gap:6px;width:100%;text-align:left}
.ag-hist-t .cr{font-size:9px;color:var(--muted);transition:transform .15s}
.ag-hist-t.open .cr{transform:rotate(90deg)}
.ag-hist-t .cnt{color:var(--muted);font-weight:600}
.ag-hist{border-left:2px solid var(--line);padding-left:10px;margin:2px 0 0 3px}
.ag-hist .h{display:flex;gap:8px;align-items:baseline;padding:5px 0;cursor:pointer;font-size:12.5px;border-bottom:1px dashed var(--line)}
.ag-hist .h:last-child{border-bottom:0}
.ag-hist .h:hover{color:var(--accent)}
.ag-hist .h .d{font-weight:600}
.ag-hist .h .a{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.ag-meta{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.ag-meta b{color:var(--ink);opacity:.75;font-weight:700}
/* caixa de prompt — instrui um agente / pergunta sobre um item */
.pbox{display:flex;gap:6px;margin-top:11px}
.pbox textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
  font-family:inherit;font-size:13.5px;line-height:1.45;padding:9px 11px;resize:vertical;outline:none;min-height:40px}
.pbox textarea:focus{border-color:var(--accent)}
.pbox button{border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:0 15px;cursor:pointer;white-space:nowrap}
.pbox button:active{transform:scale(.97)}
.phint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}
/* detalhe expansível de um item da Central */
.tk-q{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:6px;margin-left:6px}
.tk-q:hover{background:rgba(120,120,128,.14);color:var(--accent)}
.tk-detail{margin-top:7px;padding:9px 11px;background:var(--bg);border-radius:10px}
.tk-detail .dt{font-size:12.5px;line-height:1.5}
.tk-detail .none{font-size:12px;color:var(--muted);font-style:italic}
/* 🗂️ Biblioteca — notas e outputs do Claude */
.libbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.libbtn{border:0;border-radius:11px;background:rgba(120,120,128,.14);color:var(--ink);font-size:12.5px;font-weight:700;padding:8px 13px;cursor:pointer}
.libbtn:active{transform:scale(.97)}
.libbtn.pri{background:var(--accent);color:#fff}
.doc{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
.doc:last-child{border:0}
.doc .ic{font-size:14px;opacity:.6;margin-top:1px}
.doc .bd{flex:1;min-width:0}
.doc .ti{font-size:13.5px;font-weight:600;line-height:1.35}
.doc .sm{font-size:12px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc .mt{font-size:10.5px;color:var(--muted);margin-top:3px}
.doc .mt .src{background:rgba(120,120,128,.12);padding:1px 6px;border-radius:5px;margin-right:6px;font-weight:600}
.doc a.open{color:var(--accent);text-decoration:none;font-weight:600}
.doc a.open:hover{text-decoration:underline}
#libFile{display:none}

/* 🤖 Frota de agentes */
.ag-row{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line,rgba(120,120,120,.15));flex-wrap:wrap}
.ag-row:last-of-type{border-bottom:none}
.ag-name{font-weight:700;white-space:nowrap}
.ag-cad{font-size:.72rem;opacity:.65;white-space:nowrap}

.ag-role{flex-basis:100%;font-size:.78rem;opacity:.75;margin-top:1px}
.fh-row{display:flex;gap:8px;padding:5px 0;cursor:pointer;font-size:.8rem;border-bottom:1px dashed var(--line,rgba(120,120,120,.12))}
.fh-row:hover{opacity:.75}
.fh-row .d{font-weight:600}
.fh-row .a{margin-left:auto;opacity:.6}
.fh-h{font-size:.72rem;opacity:.6;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.04em}
</style>

<body>
<div id="gate" hidden>
  <div class="box">
    <h2>☀️ Orbital · Hoje</h2>
    <p>Cole o token de acesso (X-Orbital-Token). Fica salvo só neste aparelho.</p>
    <input id="tok" type="password" placeholder="token…" autocomplete="off" />
    <button id="btnEnter" type="button">Entrar</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1 id="dateLabel">Carregando…</h1>
      <div class="state" id="stateLine"></div>
    </div>
    <div class="meta">
      <div class="updated" id="updated"></div>
      <button class="refresh" id="btnBrief" type="button" title="Brief completo">📄 Brief</button>
      <button class="refresh" id="btnRefresh" type="button" title="Atualizar">⟳</button>
    </div>
  </header>
  <div id="content"></div>
</div>

<div id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><strong>📄 Brief completo</strong><button id="btnCloseModal" type="button">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<button id="fab" class="fab" type="button" aria-label="Capturar" title="Capturar (n)" hidden>+<span id="fabQ" class="fab-q" hidden></span></button>

<div id="cap" hidden>
  <div class="cap-box">
    <div class="cap-grab"></div>
    <div class="cap-head"><span class="cap-title">Captura rápida</span><button id="capClose" type="button" aria-label="Fechar">✕</button></div>
    <textarea id="capText" rows="3" placeholder="O que surgiu? tarefa, ideia, recado, follow-up…"></textarea>
    <div class="cap-foot"><span class="cap-hint">⏎ envia · ⇧⏎ nova linha</span><button id="capSave" class="cap-go" type="button">Capturar</button></div>
  </div>
</div>

<input type="file" id="libFile" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple />

<div id="toast" hidden></div>

<script>
(function(){
  "use strict";
  var API="https://inspiragoglobal.com.br/api/orbital/all";
  var LS="orbital_token";
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  // Remove invisíveis/não-ASCII que vêm do copiar-colar (NBSP, zero-width, aspas curvas, \n) — senão o fetch rejeita o header.
  function clean(s){return String(s==null?"":s).normalize("NFKC").replace(/[^\x21-\x7E]/g,"");}

  function getTok(){ try{return localStorage.getItem(LS);}catch(e){return window.__tok||null;} }
  function setTok(v){ try{localStorage.setItem(LS,v);}catch(e){window.__tok=v;} }
  function clrTok(){ try{localStorage.removeItem(LS);}catch(e){} window.__tok=null; }

  function ago(iso){
    if(!iso) return "";
    var d=(Date.now()-new Date(iso).getTime())/1000;
    if(d<90) return "agora";
    if(d<5400) return "há "+Math.round(d/60)+" min";
    if(d<172800) return "há "+Math.round(d/3600)+" h";
    return "há "+Math.round(d/86400)+" d";
  }

  function showGate(msg){
    $("app").hidden=true; $("gate").hidden=false;
    try{$("fab").hidden=true;}catch(e){}
    if(msg) $("gateErr").textContent=msg;
    try{$("tok").focus();}catch(e){}
  }

  function submitToken(){
    var v=clean($("tok").value);
    if(!v){ $("gateErr").textContent="Cole o token."; return; }
    setTok(v);
    $("gate").hidden=true;
    load();
  }

  function load(){
    var tok=getTok();
    if(!tok){ showGate(); return; }
    $("app").hidden=false;
    try{$("fab").hidden=false;}catch(e){}
    flushCap();
    $("content").innerHTML='<div class="empty">Carregando…</div>';
    fetch(API,{headers:{"X-Orbital-Token":clean(tok)}})
      .then(function(r){
        if(r.status===401){ clrTok(); showGate("Token inválido. Tente de novo."); return null; }
        if(!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      })
      .then(function(j){ if(j){ render(j.snapshot||{}); loadCaptures(); loadHistory(); loadFleetHist(); } })
      .catch(function(e){
        $("content").innerHTML='<div class="err-banner">Falha ao carregar: '+esc(e.message)+'. Toque em ⟳.</div>';
      });
  }


  // 🤖 histórico de briefings para a Frota (endpoint /history, type=briefing)
  var FLEET_HIST_API="https://inspiragoglobal.com.br/api/orbital/history?type=briefing&limit=7";
  window.__fleetHist=[];
  // O histórico alimenta DOIS lugares (painel de Agentes e Biblioteca), então busca
  // sempre que houver token — não depende mais de um elemento existir na tela.
  function loadFleetHist(){
    if(!getTok()||window.__fleetHistLoaded) return;
    window.__fleetHistLoaded=1;
    fetch(FLEET_HIST_API,{headers:{"X-Orbital-Token":clean(getTok())}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        window.__fleetHist=(j&&j.history)||[];
        var el=document.getElementById("fleetHist");
        if(el&&!window.__fleetHist.length) el.innerHTML='<div class="empty" style="font-size:.75rem">sem histórico ainda</div>';
        if(window.__snap) render(window.__snap);
      })
      .catch(function(){
        window.__fleetHistLoaded=0;
        var el3=document.getElementById("fleetHist");
        if(el3) el3.innerHTML='<div class="empty" style="font-size:.75rem">histórico indisponível</div>';
      });
  }

  var collapsed={};
  try{ collapsed=JSON.parse(localStorage.getItem("orbital_collapsed")||"{}"); }catch(e){}
  function slug(s){return String(s).replace(/[^\w]+/g,"-").toLowerCase();}
  function card(title,right,body,forceOpen){
    var k=slug(title), cl=(collapsed[k]&&!forceOpen)?" collapsed":"";
    return '<div class="card'+cl+'" data-key="'+k+'"><h2 class="card-h"><span class="caret">▸</span>'+title+(right?'<span style="margin-left:auto">'+right+'</span>':'')+'</h2><div class="card-body">'+body+'</div></div>';
  }

  var lastBrief="", activeTab=null;
  try{ activeTab=localStorage.getItem("orbital_tab"); }catch(e){}
  function linkify(text,url){ return url?('<a class="lnk" href="'+esc(url)+'" target="_blank" rel="noopener">'+text+'</a>'):text; }
  function mailTags(who,topic){ return '<span class="who-tag">'+esc(who||"")+'</span>'+(topic?'<span class="topic-tag">'+esc(topic)+'</span>':''); }
  function mailSubj(x,main){ var t=esc(x.subject||""); return x.link?'<a class="mail-subj'+(main?' main':'')+'" href="'+esc(x.link)+'" target="_blank" rel="noopener">'+t+'</a>':'<span class="mail-subj'+(main?' main':'')+'">'+t+'</span>'; }
  function parseHM(s){ if(!s) return null; var m=/(\d{1,2}):(\d{2})/.exec(String(s)); return m?(+m[1])*60+(+m[2]):null; }
  function fmtDur(min){ var hh=Math.floor(min/60), mm=min%60; return (hh?hh+"h":"")+(mm?(hh?"":"")+mm+"min":""); }
  function pad2(n){ return (n<10?"0":"")+n; }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
  // ✓ feito (local, zera por dia) — loop de fechamento/dopamina
  var doneKey="orbital_done_"+todayStr(), doneMap={};
  try{ doneMap=JSON.parse(localStorage.getItem(doneKey)||"{}"); }catch(e){}
  try{ for(var li=localStorage.length-1;li>=0;li--){ var lk=localStorage.key(li); if(/^orbital_done_/.test(lk)&&lk!==doneKey) localStorage.removeItem(lk); } }catch(e){}
  // 🌙 estado do fechamento do dia (local, zera por dia como o done)
  var closedKey="orbital_closed_"+todayStr(), pushedKey="orbital_pushed_"+todayStr(), pushedMap={};
  try{ pushedMap=JSON.parse(localStorage.getItem(pushedKey)||"{}"); }catch(e){}
  try{ for(var lj=localStorage.length-1;lj>=0;lj--){ var lk2=localStorage.key(lj); if(/^orbital_(closed|pushed)_/.test(lk2)&&lk2!==closedKey&&lk2!==pushedKey) localStorage.removeItem(lk2); } }catch(e){}
  function dayClosed(){ try{return localStorage.getItem(closedKey)==="1";}catch(e){return false;} }
  // ☠️ mortos do dia (kill declarado no 3º push) — some da lista até a rotina arquivar
  var killedKey="orbital_killed_"+todayStr(), killedMap={};
  try{ killedMap=JSON.parse(localStorage.getItem(killedKey)||"{}"); }catch(e){}
  try{ for(var lm=localStorage.length-1;lm>=0;lm--){ var lk3=localStorage.key(lm); if(/^orbital_killed_/.test(lk3)&&lk3!==killedKey) localStorage.removeItem(lk3); } }catch(e){}
  // §3 custo progressivo — contador de pushes POR ITEM, persistente (NÃO zera por dia).
  // É o que força a honestidade: 3º adiamento vira "matar ou manter?".
  var PUSHC="orbital_pushcount", pushCount={};

    var a=shipDays(); if(a.indexOf(todayStr())<0){ a.push(todayStr()); a=a.slice(-90);

  function streakN(){

  // 🌅 modo manhã: antes das 9h a página é só o motor de arranque (§1)
  function fullForced(){ try{ return sessionStorage.getItem("orbital_full")==="1"; }catch(e){ return !!window.__full; } }
  function setFull(){ try{ sessionStorage.setItem("orbital_full","1"); }catch(e){ window.__full=1; } }
  function isMorning(){ return new Date().getHours()<9 && !fullForced(); }
  function dk(s){ return slug(String(s).slice(0,80)); }
  // Mesmo item, redação diferente. A rotina reescreve o título a cada rodada e a cada
  // seção — em 21/jul o contrato da Noemi veio como "Enviar contrato de Noemi",
  // "Enviar contrato Noemi" e "Enviar contrato Noemi (25 dias travado)". Igualdade exata
  // não pega; prefixo também não (a palavra "de" no meio já quebra). Comparação por
  // conjunto de tokens significativos: um título contido no outro = mesmo item.
  var STOP={de:1,da:1,do:1,das:1,dos:1,para:1,pra:1,com:1,em:1,no:1,na:1,um:1,uma:1,
            ao:1,aos:1,dia:1,dias:1,que:1,por:1,sobre:1};
  function toks(s){
    return dk(s||"").split("-").filter(function(w){
      return w.length>2 && !STOP[w] && !/^\d+$/.test(w);
    });
  }
  function sameItem(a,b2){
    var x=toks(a), y=toks(b2);
    if(x.length<2||y.length<2) return false;      // título curto demais: não arrisca
    var small=x.length<=y.length?x:y, big=x.length<=y.length?y:x, set={};
    big.forEach(function(w){ set[w]=1; });
    return small.every(function(w){ return set[w]; });
  }

  function renderDay(day){
    var WSTART=8*60, WEND=19*60, SLOT=30, PX=26;
    var raw=(day.events||[]).map(function(e){ var st=parseHM(e.start||e.time), en=parseHM(e.end); return {e:e,st:st,dur:(st!=null&&en!=null&&en>st)?en-st:60}; });
    var timed=raw.filter(function(x){return x.st!=null;}).sort(function(a,b){return a.st-b.st;});
    var untimed=raw.filter(function(x){return x.st==null;});
    if(!raw.length) return '<div class="day"><h3>'+esc(day.label||day.date||"")+'</h3><div class="freeday">livre o dia todo</div></div>';
    // §9: censo de slots cortado. Do vazio, só o bloco sagrado 8h–9h sobrevive (§6) —
    // e ele aparece nomeado como trabalho, nunca como "slot livre".
    function free(a,z){
      var SS=8*60, SE=9*60;
      var ov=Math.min(z,SE)-Math.max(a,SS);
      return ov>=30?'<div class="sacred">🔒 deep work · 8h–9h</div>':"";
    }
    var isToday=(day.date===todayStr()), nm=nowMin(), nowDrawn=!isToday;
    var html="", cur=Math.min(WSTART, timed.length?timed[0].st:WSTART);
    if(timed.length){
      html+=free(cur, timed[0].st); cur=timed[0].st;
      timed.forEach(function(x){
        if(x.st>cur) html+=free(cur,x.st);
        if(!nowDrawn&&x.st>nm){ html+='<div class="nowline"></div>'; nowDrawn=true; }
        var hpx=Math.min(220,Math.max(42,Math.round(x.dur/SLOT)*PX));
        var past=isToday&&(x.st+x.dur)<=nm;
        html+=evBlock(x.e,hpx, x.e.start||x.e.time||"", past?"past":"");
        cur=Math.max(cur, x.st+x.dur);
      });
      if(!nowDrawn&&nm>cur){ html+='<div class="nowline"></div>'; nowDrawn=true; }
      if(cur<WEND) html+=free(cur,WEND);
    }
    if(untimed.length) html+=untimed.map(function(x){return evBlock(x.e,34,"dia todo");}).join("");
    return '<div class="day"><h3>'+esc(day.label||day.date||"")+'</h3>'+html+'</div>';
  }

  // ═══ 2.0 · Card Única Coisa (§2) ═══
  // Seleção: briefing.one_thing (escolhido pela pergunta do dominó na rotina).
  // Fallback sem rotina 2.0: focus_today[0] → primeiro P1.
  function pickOne(b,t){
    var o=b.one_thing;
    if(typeof o==="string"&&o.trim()) o={title:o};
    if(o&&o.title) return o;
    if(b.focus_today&&b.focus_today[0]) return {title:b.focus_today[0],_fb:1};
    var p=(t&&t.p1&&t.p1[0])||(t&&t.overdue&&t.overdue[0]);
    if(p&&p.title) return {title:p.title,key:p.key,link:p.link,_fb:1};
    return null;
  }
  // done key alinhado com a visão completa: o mesmo item marcado aqui aparece marcado lá
  function oneKey(b,o){
    if(!o) return null;
    var ti=o.title||"";
    return ((b.focus_today||[]).indexOf(ti)>=0) ? dk("f-"+ti) : dk("t-"+ti);
  }
  // 🁢 Cadeia do dominó: one_thing primeiro, depois o resto do foco do dia.
  // Matou a de cima → a próxima vira herói. A coluna nunca fica ociosa: sempre há
  // UMA coisa ativa para começar, que é a tese do 2.0 (motor de arranque).
  function buildChain(b,t){
    var oneT=pickOne(b,t), oneTitle=(oneT&&oneT.title)||null, chain=[];
    if(oneT) chain.push({o:oneT, k:oneKey(b,oneT), title:oneTitle, primary:true});
    (b.focus_today||[]).forEach(function(f){
      if(oneTitle&&sameItem(f,oneTitle)) return;               // já é o herói primário
      // enriquece o item de foco com a task correspondente (why/detail, idade, link)
      var m=null;
      [].concat((t&&t.p1)||[],(t&&t.overdue)||[],b.urgent||[]).forEach(function(x){ if(!m&&x&&sameItem(x.title,f)) m=x; });
      var o=m?{title:f,key:m.key,link:m.link,why:m.detail||m.why||m.note,minutes:m.minutes,stalled_days:m.stalled_days,close:m.close}:{title:f};
      chain.push({o:o, k:dk("f-"+f), title:f});
    });
    var active=null, ai=-1, done=[];
    for(var i=0;i<chain.length;i++){
      var c=chain[i];
      if(killedMap[c.k]) continue;
      if(doneMap[c.k]){ done.push(c); continue; }
      if(!active){ active=c; ai=i; }
    }
    return {chain:chain, active:active, ai:ai, done:done, oneT:oneT, oneTitle:oneTitle};
  }

  function ageCls(d){ return d==null?"":(d<3?"a-fresh":(d<10?"a-warm":"a-hot")); }

  function oneCard(b,o,k){

  // 🤖 Agentes — 4 tiles. Silêncio = saúde: só quem NÃO rodou ganha destaque.

  function fleetTiles(b,s0){

    function stOf(h2,lim){ return lim==null?"idle":(h2==null?"idle":(h2<lim?"ok":"late")); }
    var open=window.__agOpen||null, t="", det="";
    AG.forEach(function(a){
      var info=agInfo(a.k==="cos"?((s0.briefing&&s0.briefing.createdAt)||fl.cos):fl[a.k]);
      var h2=hoursSince(info.last), st=stOf(h2,a.lim);

        var resumo=info.summary || (a.k==="cos" ? (b.editorial||b.state_line||"") : "");
        var quando=info.last?ago(info.last):(a.k==="cos"&&s0.briefing?ago(s0.briefing.createdAt):"");
        det+='<div><span class="ag-lbl">último '+(a.k==="cos"?"briefing":"trabalho")+'</span>'+
             (quando?'<span class="ag-when">'+esc(quando)+'</span>':'')+'</div>';
        if(resumo) det+='<div class="ag-sum">'+esc(resumo)+'</div>';
        else if(a.ondemand) det+='<div class="ag-sum vazio">Não roda sozinho — só quando você chama. A caixa abaixo é o chamado.</div>';
        else det+='<div class="ag-sum vazio">Ainda sem resumo aqui: chega no brief de amanhã, quando a rotina emitir <code>fleet.'+esc(a.k)+'.summary</code>. O histórico completo já está no link abaixo.</div>';
        var lk=[];
        if(a.k==="cos"&&lastBrief) lk.push('<a class="lnk" href="#" data-brief="1">ler completo</a>');
        if(info.url) lk.push('<a class="lnk" href="'+esc(info.url)+'" target="_blank" rel="noopener">abrir arquivo ↗</a>');
        if(a.hist) lk.push('<a class="lnk" href="'+esc(a.hist)+'" target="_blank" rel="noopener">todos ↗</a>');
        if(lk.length) det+='<div class="links">'+lk.join("")+'</div>';

        // ── 2. Histórico, colapsado. CoS usa o endpoint /history (real, hoje);
        //      os outros dependem de fleet.<k>.history vindo da rotina. ──
        // o brief de hoje já está acima como "último" — histórico é o que veio ANTES
        var atualDia=info.last?new Date(info.last).toDateString():null;
        var hist=(a.k==="cos") ? (window.__fleetHist||[]).map(function(row,i){
                    return {label:(row.data&&row.data.date_label)||String(row.createdAt||"").slice(0,10),

                  }).filter(function(x){ return !(atualDia&&x.at&&new Date(x.at).toDateString()===atualDia); })
                  : (info.history||[]).map(function(x){ return {label:x.label||x.date||"", at:x.at||x.created, url:x.url}; });
        if(hist.length){
          var hOpen=!!window.__agHist;
          det+='<button class="ag-hist-t'+(hOpen?" open":"")+'" type="button" data-aghist="1">'+
               '<span class="cr">▸</span>histórico <span class="cnt">'+hist.length+'</span></button>';
          if(hOpen) det+='<div class="ag-hist">'+hist.slice(0,7).map(function(x){
            var inner='<span class="d">'+esc(x.label)+'</span>'+(x.at?'<span class="a">'+esc(ago(x.at))+'</span>':'');

  // ── markdown → HTML (mínimo e seguro): escapa TUDO antes de aplicar formatação ──
  function mdInline(s){
    s=esc(s);
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a class="lnk" href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function renderMd(md){
    var lines=String(md||"").replace(/\r/g,"").split("\n"), out=[], list=null;
    function closeList(){ if(list){ out.push("</"+list+">"); list=null; } }
    lines.forEach(function(ln){
      var t=ln.trim();
      if(!t){ closeList(); return; }
      if(/^(-{3,}|_{3,}|\*{3,})$/.test(t)){ closeList(); out.push('<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">'); return; }
      var mh=/^(#{1,4})\s+(.*)$/.exec(t);
      if(mh){ closeList(); var lv=Math.min(4,mh[1].length+2); out.push("<h"+lv+">"+mdInline(mh[2])+"</h"+lv+">"); return; }
      var mo=/^(\d+)[.)]\s+(.*)$/.exec(t);
      if(mo){ if(list!=="ol"){ closeList(); out.push("<ol>"); list="ol"; } out.push("<li>"+mdInline(mo[2])+"</li>"); return; }
      if(/^[-*•]\s+/.test(t)){ if(list!=="ul"){ closeList(); out.push("<ul>"); list="ul"; } out.push("<li>"+mdInline(t.replace(/^[-*•]\s+/,""))+"</li>"); return; }
      closeList();
      // linha inteira em negrito = subtítulo de seção (é como o CoS marca as seções)
      if(/^\*\*[^*]+\*\*\s*$/.test(t)) out.push('<p class="mdh">'+mdInline(t)+"</p>");
      else out.push("<p>"+mdInline(t)+"</p>");
    });
    closeList();
    return out.join("");
  }

  function render(s){
    window.__snap=s; var s0=s;
    var b=(s.briefing&&s.briefing.data)||{}, t=(s.tasks&&s.tasks.data)||{},

    var h="";

    // ⚠️ staleness — confiança no dado: avisa se o snapshot não é de hoje
    var isStale=false;

      isStale=(new Date(s.briefing.createdAt).toDateString()!==new Date().toDateString());
    }

    // 🌅 antes das 9h a página é só o motor de arranque (§1) — Caixa e Métricas nem existem

    // 🎯 a Única Coisa também abre a visão completa — e some dos outros cards (§9 dedupe)
    var CH=buildChain(b,t), oneT=CH.oneT, oneTitle=CH.oneTitle;
    var active=CH.active, activeTitle=(active&&active.title)||oneTitle;

    // ⏰ AGORA — âncora de ação única (o que fazer neste exato momento)
    // §6: depois das 19h o strip cede lugar ao ritual noturno (nada de countdown pro dia seguinte)
    var agoraHtml="";
    if(new Date().getHours()<19) (function(){
      var dayObj=null, ts=todayStr();
      (b.calendar||[]).forEach(function(d0){ if(d0.date===ts&&!dayObj) dayObj=d0; });
      if(!dayObj&&!isStale&&(b.calendar||[]).length) dayObj=b.calendar[0];
      var nm=nowMin();
      var evs=((dayObj&&dayObj.events)||[]).map(function(e){ var st=parseHM(e.start||e.time), en=parseHM(e.end);
        return {e:e,st:st,en:(st!=null&&en!=null&&en>st)?en:(st!=null?st+60:null)}; })
        .filter(function(x){return x.st!=null;}).sort(function(a,b2){return a.st-b2.st;});

        if(nxt) sub="depois: "+esc(nxt.e.title||"")+" às "+esc(nxt.e.start||nxt.e.time||""); }
      else if(nxt){ var dmin=nxt.st-nm; main=esc(nxt.e.title||"")+(isUnconf(nxt.e)?" (convite)":""); cd="em "+fmtDur(dmin);
        // §6 slot útil, não censo de slots: um recorte acionável, com o item ATIVO nomeado
        if(activeTitle) sub="dá pra matar antes ("+fmtDur(dmin)+"): "+esc(activeTitle); }
      else { main=activeTitle?esc(activeTitle):"agenda livre"; cd="resto do dia livre"; }
      var nDone=0; try{ nDone=Object.keys(doneMap).length; }catch(e){}
      agoraHtml='<div class="now-strip"><span class="k">⏰ agora</span><span class="main">'+main+'</span>'+
         (cd?'<span class="cd">'+esc(cd)+'</span>':'')+

    // 🌙 Fechamento do dia — ritual de descarga (a partir das 19h)
    if(new Date().getHours()>=19){
      var nDone2=0; try{ nDone2=Object.keys(doneMap).length; }catch(e){}
      if(dayClosed()){

          '<div class="closed-line">Até amanhã. O brief das 6h30 chega com o que você empurrou.</div>');
      } else {
        var open=[], nv=($("nightNote")&&$("nightNote").value)||"";
        (b.focus_today||[]).forEach(function(f){ var k=dk("f-"+f); if(!doneMap[k]&&!killedMap[k]) open.push({k:k,t:f}); });
        ((t&&t.p1)||[]).forEach(function(x){ var k=dk("t-"+(x.title||"")); if(!doneMap[k]&&!killedMap[k]) open.push({k:k,t:x.title||""}); });
        var rows=open.slice(0,6).map(function(o){
          return '<div class="night-row"><span class="t">'+esc(o.t)+'</span>'+pushBtn(o.k,o.t)+'</div>';
        }).join("");
        h+=card("🌙 Fechar o dia",'<span class="badge">✓ '+nDone2+' hoje</span>',
          (rows||'<div class="empty">Tudo feito. 👏</div>')+
          '<div class="night-note"><input id="nightNote" placeholder="o que ficou na cabeça?" value="'+esc(nv)+'"><button id="nightNoteBtn" type="button">guardar</button></div>'+
          '<button class="close-day" id="closeDayBtn" type="button">Fechar o dia ✓</button>');

    }

    // §9 dedupe: o item que já é a Única Coisa não se repete aqui (repetir anestesia).
    // Comparação frouxa por prefixo — a rotina reescreve o mesmo item ("Enviar contrato
    // Noemi" vs "…Noemi (25 dias travado)"), então igualdade exata deixava passar.
    // "Depois dela" = os elos do dominó APÓS o herói ativo (o que já foi para o herói
    // e o que já foi fechado não se repetem aqui). focusRest = todos os títulos de foco
    // não-primários, usado só para o dedupe da Central mais abaixo.
    var focusRest=CH.chain.filter(function(c){return !c.primary;}).map(function(c){return c.title;});
    var depoisItems=CH.chain.filter(function(c,i){ return i>CH.ai && CH.ai>=0 && !doneMap[c.k] && !killedMap[c.k]; }), depoisHtml="";
    if(depoisItems.length){
      var nU=(b.urgent||[]).length, nD=(b.decisions||[]).length;
      var badges=(nU?'<span class="badge" style="background:var(--red-bg);color:var(--red)">🔴 '+nU+'</span> ':'')+
                 (nD?'<span class="badge" style="background:var(--yellow-bg);color:var(--yellow)">🟡 '+nD+'</span>':'');
      depoisHtml=card("🎯 Depois dela",badges,
        depoisItems.map(function(c,i){var dn=doneMap[c.k];return '<div class="tk'+(dn?' done-item':'')+'" style="padding:6px 0">'+chk(c.k,c.title)+'<span class="n" style="color:var(--accent);font-weight:800;margin-right:6px">'+(i+1)+'</span>'+esc(c.title)+'</div>';}).join(""));
    }

    // coluna esquerda: fechados (fino) + herói ATIVO (ou celebração) + lotes
    var ckMain=closedStrip(CH.done)+(active?oneCard(b,active.o,active.k):heroDone())+batchCards(b);

    // ✍️ Capturado — input humano aguardando triagem (some quando a rotina processa)
    var caps=capsForDisplay(), capsHtml="";
    if(caps.length){
      capsHtml=card("✍️ Capturado",'<span class="badge" style="background:var(--orange-bg);color:var(--orange)">'+caps.length+' aguardando</span>',
        caps.map(function(c){

          return '<div class="cap-row"><span class="cap-ic">📝</span><div class="cap-txt">'+esc(c.text)+'<div class="cap-meta">'+(when?esc(when)+" · ":"")+st+'</div></div></div>';
        }).join(""));
    }

    // 📥 Central — raias por QUEM ESTÁ COM A BOLA, não por canal de origem.
    // Central e Tasks descreviam o mesmo item por ângulos diferentes: em 21/jul o contrato
    // da Noemi aparecia 3× (urgent + p1 + overdue) com 3 redações. Dedupe por `key` —
    // por título não funciona, porque a rotina reescreve o texto a cada rodada.
    var tabs=[], visto={};
    function idOf(x,ti){ return x&&x.key ? ("k:"+String(x.key).toLowerCase()) : ("t:"+dk(ti||(x&&x.title)||"")); }
    var oneId=oneT?idOf(oneT,oneTitle):null;
    // sem key nos dois lados, cai no match frouxo por título (urgent hoje não traz key)
    function isOne(x,ti){ return oneId&&idOf(x,ti)===oneId || (oneTitle&&sameItem(ti,oneTitle)); }
    // "Comigo": urgent + p1 + overdue fundidos. O título do registro de tasks vence
    // (é o que gerou as chaves done-/push- existentes — trocar quebraria o write-back).
    var mine=[], byId={};
    function addMine(x,ti,src){
      var id=idOf(x,ti); if(isOne(x,ti)) return;             // já vive no Card Única Coisa
      // item já promovido a "Depois dela" não se repete na raia geral
      for(var fi=0;fi<focusRest.length;fi++){ if(sameItem(focusRest[fi],ti)) return; }
      // urgent não traz `key` hoje, então o id não casa com o de p1/overdue —
      // cai no match por tokens contra o que já entrou na raia.
      var o=byId[id];
      if(!o){ for(var i=0;i<mine.length;i++){ if(sameItem(mine[i].title,ti)){ o=byId[id]=mine[i]; break; } } }
      if(!o){ o=byId[id]={id:id,title:ti,link:x.link,why:x.why||x.note,due:x.due,since:x.since,
                          key:x.key,detail:x.detail,stalled:stalledOf(x,x.key?dk("t-"+ti):null),src:{}}; mine.push(o); }
      o.detail=o.detail||x.detail;
      if(src!=="urgent"){ o.title=ti; o.due=o.due||x.due; o.since=o.since||x.since; o.key=o.key||x.key; }
      o.why=o.why||x.why||x.note; o.link=o.link||x.link;
      if(o.stalled==null) o.stalled=stalledOf(x,x.key?dk("t-"+ti):null);
      o.src[src]=1;
    }
    (b.urgent||[]).forEach(function(x){ addMine(x,x.title||"","urgent"); });
    ((t&&t.p1)||[]).forEach(function(x){ addMine(x,x.title||"","p1"); });
    ((t&&t.overdue)||[]).forEach(function(x){ addMine(x,x.title||"","overdue"); });

            '<div class="pbox"><textarea id="qP" rows="2" placeholder="o que é essa task? o que preciso fazer aqui?" style="font-family:inherit"></textarea>'+

        }

               '<button class="tk-q" type="button" data-q="'+esc(o.id)+'" title="detalhes e perguntas">'+(qOpen===o.id?"▾":"?")+'</button>'+
               (sub?'<div class="sub">'+esc(sub)+'</div>':'')+det+'</div>';

    if(ib){

      if(nr){ cbody+='<div class="lane"><div class="lane-h" style="color:var(--red)">🔴 Sua vez — responder</div>'+

  // ───── Captura manual: porta de entrada do humano ─────
  // Item cai numa fila local (localStorage) e é POSTado pro backend. Se o endpoint
  // ainda não existe (ou está offline), fica na fila e reenvia sozinho no próximo load.
  var CAP_API="https://inspiragoglobal.com.br/api/orbital/capture";
  var CAP_LIST_API="https://inspiragoglobal.com.br/api/orbital/captures?status=pending";
  var CAPQ="orbital_capture_queue";
  function readQ(){ try{return JSON.parse(localStorage.getItem(CAPQ)||"[]");}catch(e){return [];} }
  function writeQ(q){ try{localStorage.setItem(CAPQ,JSON.stringify(q));}catch(e){} }
  function capId(){ return "c"+Date.now()+"-"+Math.floor(Math.random()*1e6); }
  // ✓ write-back: marcar feito vira captura "done: …" — a rotina tria e marca no TASKS.md.
  // Id determinístico (dia+item): re-marcar não duplica (backend é idempotente por id).
  // Não aparece no card Capturado nem no badge — o feedback é o próprio risco no item.
  function queueDoneCapture(k,ttl){
    var id="done-"+todayStr()+"-"+k, q=readQ();
    if(!q.some(function(x){return x.id===id;})) q.push({id:id,text:"done: "+ttl,capturedAt:new Date().toISOString(),source:"dashboard-done"});
    writeQ(q); flushCap();
  }
  function undoDoneCapture(k){
    var id="done-"+todayStr()+"-"+k;
    writeQ(readQ().filter(function(x){return x.id!==id;}));  // se já foi enviada, deixa — caso raro
  }
  // done: e doc[...] são write-back, não caixa de entrada — não contam no badge nem no card Capturado
  function silent(src){ return src==="dashboard-done"||src==="dashboard-doc"||src==="dashboard-metrics"; }
  function updFab(){ var n=readQ().filter(function(x){return !silent(x.source);}).length, b=$("fabQ"); if(!b)return; if(n>0){ b.textContent=n; b.hidden=false; } else b.hidden=true; }
  // capturas a exibir = fila local (ainda enviando) + pendentes no backend (aguardando triagem), sem duplicar
  function capsForDisplay(){
    var local=readQ(), remote=window.__pendingCaps||[], seen={}, out=[];
    local.forEach(function(x){ seen[x.id]=1; if(!silent(x.source)) out.push({text:x.text,capturedAt:x.capturedAt,state:"sending"}); });
    remote.forEach(function(x){ if(seen[x.id]||silent(x.source))return; out.push({text:x.text,capturedAt:x.capturedAt||x.captured_at,state:"pending"}); });
    return out;
  }
  // 🧊 radar de emperrado — compara briefs anteriores via /history; identidade = task.key
  // (a rotina mantém o key estável entre dias; título reescrito não quebra o match)
  var HIST_API="https://inspiragoglobal.com.br/api/orbital/history?type=tasks&limit=6";
  function loadHistory(){
    var tok=getTok(); if(!tok||window.__histDays) return;
    fetch(HIST_API,{headers:{"X-Orbital-Token":clean(tok)}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        if(!j) return;
        var arr=j.history||j.items||j.events||(Array.isArray(j)?j:null); if(!arr) return;
        var byDay={};
        arr.forEach(function(e){
          var d0=(e&&e.createdAt)?String(e.createdAt).slice(0,10):null, data=e&&e.data; if(!d0||!data) return;
          if(!byDay[d0]) byDay[d0]={};
          [].concat(data.p1||[],data.overdue||[]).forEach(function(x){ if(!x) return;
            var kk=x.key||(x.title?dk("t-"+x.title):null); if(kk) byDay[d0][kk]=1; });
        });
        var days=Object.keys(byDay).sort().reverse().filter(function(d0){return d0!==todayStr();});
        window.__histDays=days.map(function(d0){return byDay[d0];});
        if(window.__snap) render(window.__snap);
      })
      .catch(function(){});
  }
  function staleBadge(kk){
    var hd=window.__histDays; if(!hd||!hd.length||!kk) return "";
    var n=0; for(var i=0;i<hd.length;i++){ if(hd[i][kk]) n++; else break; }
    return n>=2?'<span class="stale">🧊 '+(n+1)+'º brief</span>':"";
  }
  function loadCaptures(){
    var tok=getTok(); if(!tok) return;
    fetch(CAP_LIST_API,{headers:{"X-Orbital-Token":clean(tok)}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ if(j&&j.captures){ window.__pendingCaps=j.captures; if(window.__snap) render(window.__snap); } })
      .catch(function(){});
  }
  function flushCap(){
    var q=readQ(), tok=getTok();
    if(!q.length||!tok){ updFab(); return; }
    var item=q[0];
    fetch(CAP_API,{method:"POST",headers:{"Content-Type":"application/json","X-Orbital-Token":clean(tok)},body:JSON.stringify(item)})
      .then(function(r){
        if(!r.ok){ updFab(); return; }  // 4xx/5xx — mantém na fila
        // 200 só conta se vier JSON com ok:true. HTML 200 (rota inexistente) NÃO limpa a fila —
        // senão a captura evapora silenciosamente. Mantém na fila e o badge avisa.
        return r.json().then(function(j){
          if(j&&j.ok){ writeQ(readQ().filter(function(x){return x.id!==item.id;})); updFab(); loadCaptures(); flushCap(); }
          else updFab();
        },function(){ updFab(); });  // corpo não-JSON → mantém na fila
      })
      .catch(function(){ updFab(); });  // offline — mantém na fila
  }
  function toast(msg){
    var t=$("toast"); if(!t)return; t.textContent=msg; t.hidden=false;
    requestAnimationFrame(function(){ t.classList.add("show"); });
    clearTimeout(window.__toastT);
    window.__toastT=setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){t.hidden=true;},250); },1800);
  }
  function openCap(){ $("cap").hidden=false; var ta=$("capText"); ta.value=""; setTimeout(function(){try{ta.focus();}catch(e){}},30); }
  function closeCap(){ $("cap").hidden=true; }
  function saveCap(){
    var ta=$("capText"), txt=(ta.value||"").trim();
    if(!txt){ closeCap(); return; }
    var q=readQ(); q.push({id:capId(),text:txt,capturedAt:new Date().toISOString(),source:"manual"}); writeQ(q);
    closeCap(); updFab(); if(window.__snap) render(window.__snap); toast(getTok()?"✓ Capturado":"✓ Salvo (entra ao logar)"); flushCap();
  }
  // 🗂️ importar .md: lê local, guarda preview e enfileira captura doc[...] pro cofre.
  // O envio é a mesma fila idempotente das capturas — offline não perde nada.
  $("libFile").addEventListener("change",function(ev){
    var fs=[].slice.call(ev.target.files||[]); if(!fs.length) return;
    var LIM=200000, lidos=0;
    fs.forEach(function(f){
      var r=new FileReader();
      r.onload=function(){
        var txt=String(r.result||"");
        if(txt.length>LIM) txt=txt.slice(0,LIM)+"\n\n[…truncado na importação]";
        var id="doc-"+todayStr()+"-"+slug(f.name);
        var docs=readDocs().filter(function(x){return x.id!==id;});
        docs.push({id:id,title:f.name.replace(/\.(md|markdown|txt)$/i,""),name:f.name,
          summary:summarize(txt),text:txt,at:new Date().toISOString(),src:"importado",kind:"doc",state:"pending"});
        writeDocs(docs);
        var q=readQ();
        if(!q.some(function(x){return x.id===id;}))
          q.push({id:id,text:"doc["+f.name+"]: "+txt,capturedAt:new Date().toISOString(),source:"dashboard-doc"});
        writeQ(q);
        if(++lidos===fs.length){
          flushCap(); toast("📄 "+lidos+(lidos>1?" arquivos importados":" arquivo importado"));
          if(window.__snap) render(window.__snap);
        }
      };
      r.onerror=function(){ toast("Falha ao ler "+f.name); };
      r.readAsText(f);
    });
    ev.target.value="";
  });
  $("fab").addEventListener("click",openCap);
  $("capSave").addEventListener("click",saveCap);
  $("capClose").addEventListener("click",closeCap);
  $("cap").addEventListener("click",function(e){ if(e.target===$("cap")) closeCap(); });
  $("capText").addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); saveCap(); }
    else if(e.key==="Escape"){ closeCap(); }
  });
  document.addEventListener("keydown",function(e){
    var tag=(e.target&&e.target.tagName)||"";
    if((e.key==="n"||e.key==="N")&&!/^(INPUT|TEXTAREA)$/.test(tag)&&$("cap").hidden&&$("gate").hidden){ e.preventDefault(); openCap(); }
  });
  // 📈 POST das métricas (Onda 3, item c — corrigido 25/ago).
  // Primeira versão só enfileirava na SEXTA depois das 18h. Falhou na estreia
  // (21/ago): o Conselheiro rodou às 19h52 e não achou nada, porque a métrica
  // dependia de o dashboard estar aberto naquela janela — a mesma dependência de
  // *pull* que a Onda 4 inteira existiu para matar. O instrumento que mede o uso
  // não pode depender do uso que ele mede.
  // Agora: em QUALQUER abertura, envia o dia JÁ FECHADO que ainda não foi enviado.
  // Um dia = uma captura, id determinístico; a agregação da semana é de quem lê.
  function metricsFor(dstr){ try{ return JSON.parse(localStorage.getItem("orbital_metrics_"+dstr)||"null"); }catch(e){ return null; } }
  function flushDailyMetrics(){
    var hoje=todayStr(), fila=readQ(), novos=0, d=new Date();
    d.setDate(d.getDate()-1);                                  // começa em ontem
    for(var i=0;i<14;i++){                                     // dentro dos 21 dias que o localStorage guarda
      var k=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
      d.setDate(d.getDate()-1);
      if(k===hoje) continue;                                   // dia aberto não se mede
      var id="metrics-"+k, SENT="orbital_metrics_sent_"+id;
      try{ if(localStorage.getItem(SENT)) continue; }catch(e){}
      if(fila.some(function(x){ return x.id===id; })) continue;
      var m=metricsFor(k); if(!m) continue;                    // dia sem abertura: nada a contar
      var p={day:k, opens:m.opens||0, actions:m.actions||0, pushes:m.pushes||0,
             kills:m.kills||0, closes:m.closes||0, expands:m.expands||0,
             activation_s:(m.activation_s==null?null:m.activation_s), opened_at:m.opened_at||null};
      p.resumo=p.actions+" ações · "+p.closes+" fechamentos · "+p.pushes+" pushes · "+p.kills+" kills"+
               (p.activation_s!=null?" · ativação "+p.activation_s+"s":"");
      fila.push({id:id, text:"metrics: "+JSON.stringify(p),
                 capturedAt:new Date().toISOString(), source:"dashboard-metrics"});
      try{ localStorage.setItem(SENT,"1"); }catch(e){}
      novos++;
    }
    if(novos){ writeQ(fila); flushCap(); }
  }
  flushDailyMetrics();

  updFab();

  $("btnBrief").addEventListener("click",function(){ showModalMd(lastBrief||"(sem brief)"); });
  $("btnCloseModal").addEventListener("click",function(){ $("modal").hidden=true; });
  $("modal").addEventListener("click",function(e){ if(e.target===$("modal")) $("modal").hidden=true; });
  $("btnEnter").addEventListener("click",submitToken);
  $("tok").addEventListener("keydown",function(e){ if(e.key==="Enter") submitToken(); });
  $("btnRefresh").addEventListener("click",load);
  // contagem regressiva do AGORA + linha do agora se atualizam a cada minuto
  setInterval(function(){ if(window.__snap&&!document.hidden) render(window.__snap); },60000);
  load();
})();
</script>
